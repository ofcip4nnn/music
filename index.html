<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluefy Music</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#05070b;
    color:#fff;
    min-height:100vh;
    padding-bottom:115px;
    overflow-x:hidden;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(circle at 20% 0%,rgba(0,110,255,.22),transparent 30%),
        radial-gradient(circle at 90% 30%,rgba(0,70,180,.13),transparent 35%),
        #05070b;
}

/* HEADER */
header{
    padding:24px 18px 12px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#1683ff;
}

.profile{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg,#1683ff,#063b91);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* SEARCH */
.search{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#11151d;
    border:1px solid #202734;
    border-radius:14px;
    padding:13px 15px;
}

.search svg{
    width:20px;
    fill:#87909e;
}

.search input{
    flex:1;
    background:none;
    border:0;
    outline:none;
    color:white;
    font-size:15px;
}

.search input::placeholder{
    color:#727a88;
}

.search button{
    border:0;
    background:#1683ff;
    color:white;
    width:34px;
    height:34px;
    border-radius:10px;
    cursor:pointer;
}

/* SECTION */
.section{
    padding:18px;
}

.section-title{
    font-size:21px;
    font-weight:800;
    margin-bottom:14px;
}

/* LAST PLAYED */
.last-grid{
    display:flex;
    gap:13px;
    overflow-x:auto;
    scrollbar-width:none;
}

.last-grid::-webkit-scrollbar{
    display:none;
}

.last-card{
    min-width:145px;
    max-width:145px;
    cursor:pointer;
}

.cover{
    width:145px;
    height:145px;
    border-radius:12px;
    object-fit:cover;
    background:#111821;
    display:block;
}

.last-title{
    margin-top:9px;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.last-artist{
    color:#7f8795;
    font-size:12px;
    margin-top:4px;
}

/* SEARCH RESULT */
.results{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.result-card{
    background:linear-gradient(145deg,#10151e,#0a0d13);
    border:1px solid #1c2430;
    border-radius:16px;
    padding:10px;
    cursor:pointer;
    transition:.2s;
}

.result-card:active{
    transform:scale(.97);
}

.result-cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:11px;
    background:#151b24;
}

.result-info{
    padding:8px 2px 3px;
}

.result-title{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.result-artist{
    font-size:12px;
    color:#777f8d;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play-small{
    margin-top:9px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:0;
    background:#1683ff;
    color:white;
    float:right;
}

/* EMPTY */
.empty{
    color:#69717e;
    text-align:center;
    padding:35px 10px;
    grid-column:1/-1;
}

/* NOTIFICATION */
.notification{
    position:fixed;
    top:18px;
    left:50%;
    transform:translate(-50%,-130%);
    width:calc(100% - 30px);
    max-width:390px;
    background:#101722;
    border:1px solid #243142;
    border-radius:15px;
    padding:14px;
    z-index:100;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    transition:.35s cubic-bezier(.2,.8,.2,1);
}

.notification.show{
    transform:translate(-50%,0);
}

.notif-box{
    display:flex;
    align-items:center;
    gap:12px;
}

.notif-icon{
    width:42px;
    height:42px;
    border-radius:11px;
    background:#1683ff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:19px;
}

.notif-title{
    font-size:14px;
    font-weight:bold;
}

.notif-text{
    color:#788292;
    font-size:12px;
    margin-top:3px;
}

/* MINI PLAYER */
.mini-player{
    position:fixed;
    left:10px;
    right:10px;
    bottom:70px;
    height:66px;
    background:rgba(15,19,26,.96);
    border:1px solid #242d39;
    border-radius:14px;
    z-index:50;
    display:none;
    align-items:center;
    padding:7px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
}

.mini-player.show{
    display:flex;
}

.mini-cover{
    width:51px;
    height:51px;
    border-radius:9px;
    object-fit:cover;
}

.mini-info{
    flex:1;
    min-width:0;
    padding:0 11px;
}

.mini-title{
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mini-artist{
    font-size:11px;
    color:#737c8b;
    margin-top:4px;
}

.mini-play{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#1683ff;
    color:#fff;
    font-size:16px;
}

/* FULL PLAYER */
.player{
    position:fixed;
    inset:0;
    z-index:80;
    background:#05070b;
    transform:translateY(100%);
    transition:.4s cubic-bezier(.2,.8,.2,1);
    display:flex;
    flex-direction:column;
    padding:18px;
}

.player.open{
    transform:translateY(0);
}

.player-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.player-top button{
    width:42px;
    height:42px;
    border:1px solid #252e3b;
    background:#10151d;
    color:#fff;
    border-radius:12px;
}

.player-cover{
    width:min(78vw,330px);
    aspect-ratio:1;
    border-radius:18px;
    object-fit:cover;
    margin:45px auto 30px;
    box-shadow:0 25px 70px rgba(0,90,255,.22);
}

.player-title{
    font-size:24px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    color:#7d8695;
    margin-top:7px;
}

.progress{
    margin-top:27px;
}

.progress input{
    width:100%;
    accent-color:#1683ff;
}

.times{
    display:flex;
    justify-content:space-between;
    color:#697281;
    font-size:11px;
    margin-top:5px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:28px;
}

.control{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#121821;
    color:#fff;
    font-size:17px;
}

.main-play{
    width:66px;
    height:66px;
    background:#1683ff;
    font-size:24px;
}

.volume{
    margin-top:25px;
    display:flex;
    gap:10px;
    align-items:center;
}

.volume input{
    flex:1;
    accent-color:#1683ff;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:rgba(6,8,12,.97);
    border-top:1px solid #1c222c;
    z-index:60;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    color:#68717f;
    text-align:center;
    font-size:10px;
    cursor:pointer;
}

.nav-item.active{
    color:#1683ff;
}

.nav-icon{
    font-size:20px;
    display:block;
    margin-bottom:3px;
}

/* LOADING */
.loading{
    display:none;
    text-align:center;
    padding:35px;
    color:#788291;
}

.loading.show{
    display:block;
}

.loader{
    width:28px;
    height:28px;
    border:3px solid #253142;
    border-top-color:#1683ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

@media(min-width:700px){
    .results{
        grid-template-columns:repeat(4,1fr);
    }

    .section{
        max-width:1000px;
        margin:auto;
    }

    header{
        max-width:1000px;
        margin:auto;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- NOTIFICATION -->
<div class="notification" id="notification">
    <div class="notif-box">
        <div class="notif-icon" id="notifIcon">♫</div>
        <div>
            <div class="notif-title" id="notifTitle">Bluefy Music</div>
            <div class="notif-text" id="notifText">Siap memutar musik</div>
        </div>
    </div>
</div>

<header>
    <div class="top">
        <div class="logo">blue<span>fy</span></div>
        <div class="profile">B</div>
    </div>

    <div class="search">
        <svg viewBox="0 0 24 24">
            <path d="M10 2a8 8 0 105.29 14L20 20.71 21.41 19.3l-4.7-4.7A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
        </svg>

        <input id="searchInput"
               placeholder="Apa yang ingin kamu dengarkan?">

        <button onclick="searchMusic()">⌕</button>
    </div>
</header>

<!-- LAST PLAYED -->
<section class="section">
    <div class="section-title">Putar terakhir</div>

    <div class="last-grid" id="lastPlayed">
        <div class="empty">Belum ada lagu yang diputar</div>
    </div>
</section>

<!-- SEARCH RESULTS -->
<section class="section">
    <div class="section-title">Hasil pencarian</div>

    <div class="loading" id="loading">
        <div class="loader"></div>
        Mencari lagu...
    </div>

    <div class="results" id="results">
        <div class="empty">
            Cari lagu favoritmu di atas 🎵
        </div>
    </div>
</section>

<!-- MINI PLAYER -->
<div class="mini-player" id="miniPlayer">
    <img class="mini-cover" id="miniCover">

    <div class="mini-info" onclick="openPlayer()">
        <div class="mini-title" id="miniTitle">Tidak ada lagu</div>
        <div class="mini-artist" id="miniArtist">-</div>
    </div>

    <button class="mini-play" onclick="togglePlay()" id="miniPlay">▶</button>
</div>

<!-- FULL PLAYER -->
<div class="player" id="player">

    <div class="player-top">
        <button onclick="closePlayer()">⌄</button>
        <b>Sedang diputar</b>
        <button onclick="closePlayer()">×</button>
    </div>

    <img class="player-cover" id="playerCover">

    <div class="player-title" id="playerTitle">Tidak ada lagu</div>
    <div class="player-artist" id="playerArtist">-</div>

    <div class="progress">
        <input type="range" id="progress" value="0" min="0" max="100">
        <div class="times">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="control" onclick="skip(-10)">↶</button>
        <button class="control main-play" onclick="togglePlay()" id="mainPlay">▶</button>
        <button class="control" onclick="skip(10)">↷</button>
    </div>

    <div class="volume">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="1" step=".01" value="1">
    </div>

</div>

<!-- AUDIO -->
<audio id="audio"></audio>

<!-- NAV -->
<nav class="bottom-nav">
    <div class="nav-item active">
        <span class="nav-icon">⌂</span>
        Home
    </div>

    <div class="nav-item" onclick="focusSearch()">
        <span class="nav-icon">⌕</span>
        Cari
    </div>

    <div class="nav-item" onclick="openPlayer()">
        <span class="nav-icon">♫</span>
        Player
    </div>

    <div class="nav-item" onclick="showLast()">
        <span class="nav-icon">◷</span>
        Terakhir
    </div>
</nav>

<script>
const API =
"https://api.ikyyxd.my.id/search/ytplay?q=";

const audio =
document.getElementById("audio");

let currentSong = null;
let notificationTimer;

/* =========================
   NOTIFICATION
========================= */

function notify(title,text,icon="♫"){
    clearTimeout(notificationTimer);

    document.getElementById("notifTitle").textContent = title;
    document.getElementById("notifText").textContent = text;
    document.getElementById("notifIcon").textContent = icon;

    const n =
    document.getElementById("notification");

    n.classList.add("show");

    notificationTimer =
    setTimeout(()=>{
        n.classList.remove("show");
    },2500);
}

/* =========================
   SEARCH
========================= */

async function searchMusic(){

    const input =
    document.getElementById("searchInput");

    const q =
    input.value.trim();

    if(!q){
        notify(
            "Masukkan lagu",
            "Ketik judul lagu terlebih dahulu",
            "!"
        );
        return;
    }

    const loading =
    document.getElementById("loading");

    const results =
    document.getElementById("results");

    results.innerHTML = "";

    loading.classList.add("show");

    notify(
        "Mencari lagu",
        `"${q}" sedang dicari...`,
        "⌕"
    );

    try{

        const response =
        await fetch(
            API + encodeURIComponent(q)
        );

        if(!response.ok)
            throw new Error("API Error");

        const data =
        await response.json();

        const songs =
        extractSongs(data);

        loading.classList.remove("show");

        if(!songs.length){

            results.innerHTML =
            `<div class="empty">
                Lagu tidak ditemukan
            </div>`;

            notify(
                "Tidak ditemukan",
                "Coba gunakan judul lagu lain",
                "!"
            );

            return;
        }

        notify(
            "Lagu ditemukan",
            `${songs.length} hasil ditemukan`,
            "✓"
        );

        renderResults(songs);

    }catch(error){

        console.error(error);

        loading.classList.remove("show");

        results.innerHTML =
        `<div class="empty">
            Gagal mengambil lagu.<br>
            Periksa koneksi atau API.
        </div>`;

        notify(
            "Terjadi kesalahan",
            "Tidak dapat mengambil hasil lagu",
            "!"
        );
    }
}

/* =========================
   EXTRACT API DATA
========================= */

function extractSongs(data){

    let arr = [];

    if(Array.isArray(data))
        arr = data;

    else if(Array.isArray(data.data))
        arr = data.data;

    else if(Array.isArray(data.result))
        arr = data.result;

    else if(Array.isArray(data.results))
        arr = data.results;

    else if(data.data && typeof data.data === "object")
        arr = [data.data];

    else if(typeof data === "object")
        arr = [data];

    return arr
        .map(normalizeSong)
        .filter(x => x.audio);
}

function normalizeSong(item){

    return {

        title:
        item.title ||
        item.name ||
        item.song ||
        "Unknown Song",

        artist:
        item.artist ||
        item.author ||
        item.channel ||
        "Unknown Artist",

        audio:
        item.audio ||
        item.audio_url ||
        item.download ||
        item.download_url ||
        item.url ||
        "",

        cover:
        item.thumbnail ||
        item.thumb ||
        item.image ||
        item.cover ||
        "https://placehold.co/500x500/10151d/1683ff?text=♫"
    };
}

/* =========================
   RENDER
========================= */

function renderResults(songs){

    const results =
    document.getElementById("results");

    results.innerHTML = "";

    songs.forEach((song,index)=>{

        const card =
        document.createElement("div");

        card.className =
        "result-card";

        card.innerHTML = `
            <img
                class="result-cover"
                src="${escapeHTML(song.cover)}"
                onerror="this.src='https://placehold.co/500x500/10151d/1683ff?text=♫'"
            >

            <div class="result-info">
                <div class="result-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="result-artist">
                    ${escapeHTML(song.artist)}
                </div>

                <button class="play-small">
                    ▶
                </button>

                <div style="clear:both"></div>
            </div>
        `;

        card.onclick =
        ()=>playSong(song);

        results.appendChild(card);
    });
}

/* =========================
   PLAY SONG
========================= */

function playSong(song){

    if(!song.audio){
        notify(
            "Audio tidak tersedia",
            "URL musik tidak ditemukan",
            "!"
        );
        return;
    }

    currentSong = song;

    audio.src = song.audio;

    audio.play()
    .then(()=>{
        updatePlayerUI();
        saveLastPlayed(song);

        notify(
            "Sedang diputar",
            song.title,
            "▶"
        );
    })
    .catch(error=>{
        console.error(error);

        notify(
            "Tidak dapat diputar",
            "URL audio tidak bisa diputar",
            "!"
        );
    });

    document
    .getElementById("miniPlayer")
    .classList.add("show");

    updatePlayerUI();
}

/* =========================
   PLAYER
========================= */

function togglePlay(){

    if(!currentSong){
        notify(
            "Belum ada lagu",
            "Pilih lagu terlebih dahulu",
            "♫"
        );
        return;
    }

    if(audio.paused){

        audio.play()
        .catch(()=>{});

    }else{
        audio.pause();
    }

    updatePlayButton();
}

function updatePlayButton(){

    const icon =
    audio.paused ? "▶" : "Ⅱ";

    document.getElementById("miniPlay")
    .textContent = icon;

    document.getElementById("mainPlay")
    .textContent = icon;
}

audio.addEventListener(
    "play",
    updatePlayButton
);

audio.addEventListener(
    "pause",
    updatePlayButton
);

function skip(seconds){

    if(!audio.src) return;

    audio.currentTime += seconds;
}

function openPlayer(){

    if(!currentSong){
        notify(
            "Belum ada lagu",
            "Pilih lagu terlebih dahulu",
            "♫"
        );
        return;
    }

    document
    .getElementById("player")
    .classList.add("open");
}

function closePlayer(){

    document
    .getElementById("player")
    .classList.remove("open");
}

function updatePlayerUI(){

    if(!currentSong) return;

    document.getElementById("miniCover").src =
    currentSong.cover;

    document.getElementById("miniTitle").textContent =
    currentSong.title;

    document.getElementById("miniArtist").textContent =
    currentSong.artist;

    document.getElementById("playerCover").src =
    currentSong.cover;

    document.getElementById("playerTitle").textContent =
    currentSong.title;

    document.getElementById("playerArtist").textContent =
    currentSong.artist;

    updatePlayButton();
}

/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{
        document.getElementById("duration")
        .textContent =
        formatTime(audio.duration);
    }
);

audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration) return;

        const percent =
        (audio.currentTime /
        audio.duration) * 100;

        document.getElementById("progress")
        .value = percent;

        document.getElementById("currentTime")
        .textContent =
        formatTime(audio.currentTime);
    }
);

document
.getElementById("progress")
.addEventListener(
    "input",
    e=>{

        if(!audio.duration) return;

        audio.currentTime =
        (e.target.value / 100) *
        audio.duration;
    }
);

document
.getElementById("volume")
.addEventListener(
    "input",
    e=>{
        audio.volume =
        e.target.value;
    }
);

function formatTime(sec){

    if(!isFinite(sec))
        return "0:00";

    const m =
    Math.floor(sec / 60);

    const s =
    Math.floor(sec % 60)
    .toString()
    .padStart(2,"0");

    return `${m}:${s}`;
}

/* =========================
   LAST PLAYED
========================= */

function saveLastPlayed(song){

    let history =
    JSON.parse(
        localStorage.getItem("bluefy_history")
        || "[]"
    );

    history =
    history.filter(
        x=>x.audio !== song.audio
    );

    history.unshift(song);

    history =
    history.slice(0,10);

    localStorage.setItem(
        "bluefy_history",
        JSON.stringify(history)
    );

    renderLastPlayed();
}

function renderLastPlayed(){

    const container =
    document.getElementById("lastPlayed");

    let history =
    JSON.parse(
        localStorage.getItem("bluefy_history")
        || "[]"
    );

    if(!history.length){

        container.innerHTML =
        `<div class="empty">
            Belum ada lagu yang diputar
        </div>`;

        return;
    }

    container.innerHTML = "";

    history.forEach(song=>{

        const card =
        document.createElement("div");

        card.className =
        "last-card";

        card.innerHTML = `
            <img
                class="cover"
                src="${escapeHTML(song.cover)}"
                onerror="this.src='https://placehold.co/500x500/10151d/1683ff?text=♫'"
            >

            <div class="last-title">
                ${escapeHTML(song.title)}
            </div>

            <div class="last-artist">
                ${escapeHTML(song.artist)}
            </div>
        `;

        card.onclick =
        ()=>playSong(song);

        container.appendChild(card);
    });
}

/* =========================
   NAV
========================= */

function focusSearch(){

    document
    .getElementById("searchInput")
    .focus();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function showLast(){

    document
    .getElementById("lastPlayed")
    .scrollIntoView({
        behavior:"smooth"
    });
}

/* =========================
   ENTER SEARCH
========================= */

document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    e=>{
        if(e.key === "Enter")
            searchMusic();
    }
);

/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName === "INPUT"
        ) return;

        if(e.code === "Space"){

            e.preventDefault();
            togglePlay();

        }

        if(e.code === "ArrowRight")
            skip(10);

        if(e.code === "ArrowLeft")
            skip(-10);
    }
);

/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =========================
   INIT
========================= */

renderLastPlayed();
</script>
