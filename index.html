<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player REST API</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.app{
  max-width:500px;
  margin:auto;
}

/* SEARCH */

.search{
  display:flex;
  gap:8px;
  margin-bottom:25px;
}

.search input{
  flex:1;
  padding:15px;
  border:1px solid #333;
  border-radius:14px;
  outline:none;
  background:#111;
  color:white;
  font-size:15px;
}

.search button{
  border:0;
  border-radius:14px;
  padding:0 18px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

/* COVER */

.cover-box{
  display:flex;
  justify-content:center;
}

.cover{
  width:300px;
  height:300px;
  object-fit:cover;
  border-radius:20px;
  background:#151515;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}

/* INFO */

.info{
  margin-top:25px;
}

.title{
  font-size:24px;
  font-weight:bold;
}

.artist{
  color:#999;
  margin-top:6px;
}

/* PROGRESS */

.progress{
  width:100%;
  margin-top:25px;
}

input[type="range"]{
  width:100%;
  accent-color:white;
}

.time{
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:12px;
  margin-top:5px;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  margin-top:20px;
}

.control{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.play{
  width:65px;
  height:65px;
  background:white;
  color:black;
  font-size:25px;
}

/* VOLUME */

.volume{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:20px;
}

.volume input{
  flex:1;
}

/* STATUS */

.status{
  text-align:center;
  color:#888;
  margin:20px 0;
  font-size:13px;
}

.error{
  color:#ff6b6b;
}

/* LOADING */

.loading{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{
    opacity:.4;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SEARCH -->
  <div class="search">
    <input
      id="query"
      type="text"
      placeholder="Cari judul lagu..."
      value="Laskar Cinta">

    <button onclick="searchMusic()">
      Cari
    </button>
  </div>


  <!-- STATUS -->
  <div id="status" class="status">
    Masukkan judul lagu lalu tekan Cari
  </div>


  <!-- COVER -->
  <div class="cover-box">

    <img
      id="cover"
      class="cover"
      src="https://via.placeholder.com/500/111111/ffffff?text=Music"
      alt="Cover">

  </div>


  <!-- INFO -->
  <div class="info">

    <div id="title" class="title">
      Belum ada lagu
    </div>

    <div id="artist" class="artist">
      -
    </div>

  </div>


  <!-- PROGRESS -->
  <div class="progress">

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0">

    <div class="time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

  </div>


  <!-- CONTROLS -->
  <div class="controls">

    <button
      class="control"
      onclick="skip(-10)">
      ↶
    </button>

    <button
      class="control play"
      id="playBtn"
      onclick="togglePlay()">
      ▶
    </button>

    <button
      class="control"
      onclick="skip(10)">
      ↷
    </button>

  </div>


  <!-- VOLUME -->
  <div class="volume">

    <button
      id="muteBtn"
      onclick="toggleMute()">
      🔊
    </button>

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1">

  </div>


  <!-- AUDIO -->
  <audio id="audio"></audio>

</div>


<script>

/* =====================================
   CONFIG
===================================== */

const API =
  "https://api.ikyyxd.my.id/search/ytplay?q=";


/* =====================================
   ELEMENT
===================================== */

const audio =
  document.getElementById("audio");

const query =
  document.getElementById("query");

const title =
  document.getElementById("title");

const artist =
  document.getElementById("artist");

const cover =
  document.getElementById("cover");

const status =
  document.getElementById("status");

const playBtn =
  document.getElementById("playBtn");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const volume =
  document.getElementById("volume");

const muteBtn =
  document.getElementById("muteBtn");


/* =====================================
   SEARCH MUSIC
===================================== */

async function searchMusic(){

  const q =
    query.value.trim();

  if(!q){

    status.textContent =
      "Masukkan judul lagu terlebih dahulu.";

    return;

  }


  try{

    status.classList.add("loading");

    status.classList.remove("error");

    status.textContent =
      "Mencari lagu...";


    /*
      Encode query agar judul lagu
      seperti "Dewa 19 - Laskar Cinta"
      tetap aman di URL.
    */

    const url =
      API + encodeURIComponent(q);


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "API Error " + response.status
      );

    }


    const data =
      await response.json();


    console.log("API RESPONSE:", data);


    /*
      Ambil data dari berbagai kemungkinan
      struktur JSON.
    */

    const result =
      findMusicData(data);


    if(!result.audio){

      console.log(data);

      throw new Error(
        "URL audio tidak ditemukan pada response API."
      );

    }


    /* INFO */

    title.textContent =
      result.title || q;

    artist.textContent =
      result.artist || "Unknown Artist";


    /* COVER */

    if(result.thumbnail){

      cover.src =
        result.thumbnail;

    }


    /* AUDIO */

    audio.src =
      result.audio;

    audio.load();


    status.classList.remove("loading");

    status.textContent =
      "Lagu ditemukan ✓";


    /*
      Langsung mencoba memutar.
      Browser bisa memblokir autoplay,
      sehingga jika gagal user tinggal
      menekan tombol Play.
    */

    try{

      await audio.play();

    }catch{

      playBtn.textContent = "▶";

    }

  }catch(error){

    console.error(error);

    status.classList.remove("loading");

    status.classList.add("error");

    status.textContent =
      "Gagal memutar: " + error.message;

  }

}


/* =====================================
   FIND MUSIC DATA
===================================== */

function findMusicData(data){

  let audioUrl = null;
  let titleText = null;
  let artistText = null;
  let thumbnailUrl = null;


  /*
    Fungsi rekursif untuk mencari
    key yang umum digunakan API.
  */

  function scan(obj){

    if(!obj || typeof obj !== "object")
      return;


    for(const key in obj){

      const value = obj[key];

      if(typeof value === "string"){

        const lower =
          key.toLowerCase();


        /* AUDIO */

        if(
          !audioUrl &&
          (
            lower === "audio" ||
            lower === "audio_url" ||
            lower === "audiourl" ||
            lower === "download" ||
            lower === "download_url" ||
            lower === "downloadurl" ||
            lower === "url"
          )
        ){

          if(
            value.startsWith("http") &&
            (
              value.includes(".mp3") ||
              value.includes(".m4a") ||
              value.includes(".webm") ||
              lower.includes("audio") ||
              lower.includes("download")
            )
          ){

            audioUrl = value;

          }

        }


        /* TITLE */

        if(
          !titleText &&
          (
            lower === "title" ||
            lower === "name"
          )
        ){

          titleText = value;

        }


        /* ARTIST */

        if(
          !artistText &&
          (
            lower === "artist" ||
            lower === "author" ||
            lower === "channel"
          )
        ){

          artistText = value;

        }


        /* THUMBNAIL */

        if(
          !thumbnailUrl &&
          (
            lower === "thumbnail" ||
            lower === "thumb" ||
            lower === "image" ||
            lower === "cover"
          )
        ){

          if(value.startsWith("http")){

            thumbnailUrl = value;

          }

        }

      }


      if(
        typeof value === "object"
      ){

        scan(value);

      }

    }

  }


  scan(data);


  return {

    audio: audioUrl,

    title: titleText,

    artist: artistText,

    thumbnail: thumbnailUrl

  };

}


/* =====================================
   PLAY / PAUSE
===================================== */

function togglePlay(){

  if(!audio.src){

    status.textContent =
      "Cari lagu terlebih dahulu.";

    return;

  }


  if(audio.paused){

    audio.play();

  }else{

    audio.pause();

  }

}


audio.addEventListener(
  "play",
  ()=>{
    playBtn.textContent = "❚❚";
  }
);


audio.addEventListener(
  "pause",
  ()=>{
    playBtn.textContent = "▶";
  }
);


/* =====================================
   TIME
===================================== */

audio.addEventListener(
  "loadedmetadata",
  ()=>{

    duration.textContent =
      formatTime(audio.duration);

  }
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(audio.duration){

      progress.value =
        (audio.currentTime /
        audio.duration) * 100;

    }


    current.textContent =
      formatTime(audio.currentTime);

  }
);


function formatTime(seconds){

  if(!Number.isFinite(seconds))
    return "0:00";


  const min =
    Math.floor(seconds / 60);

  const sec =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");


  return `${min}:${sec}`;

}


/* =====================================
   SEEK
===================================== */

progress.addEventListener(
  "input",
  ()=>{

    if(audio.duration){

      audio.currentTime =
        (progress.value / 100)
        * audio.duration;

    }

  }
);


/* =====================================
   SKIP
===================================== */

function skip(seconds){

  if(!audio.duration)
    return;


  audio.currentTime =
    Math.max(
      0,
      Math.min(
        audio.duration,
        audio.currentTime + seconds
      )
    );

}


/* =====================================
   VOLUME
===================================== */

volume.addEventListener(
  "input",
  ()=>{

    audio.volume =
      volume.value;


    if(audio.volume === 0){

      muteBtn.textContent =
        "🔇";

    }else{

      muteBtn.textContent =
        "🔊";

    }

  }
);


/* =====================================
   MUTE
===================================== */

function toggleMute(){

  audio.muted =
    !audio.muted;


  muteBtn.textContent =
    audio.muted
      ? "🔇"
      : "🔊";

}


/* =====================================
   ENTER SEARCH
===================================== */

query.addEventListener(
  "keydown",
  (e)=>{

    if(e.key === "Enter"){

      searchMusic();

    }

  }
);


/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
  "keydown",
  (e)=>{

    if(
      e.target.tagName === "INPUT"
    ){
      return;
    }


    if(e.code === "Space"){

      e.preventDefault();

      togglePlay();

    }


    if(e.key === "ArrowRight"){

      skip(5);

    }


    if(e.key === "ArrowLeft"){

      skip(-5);

    }


    if(
      e.key.toLowerCase() === "m"
    ){

      toggleMute();

    }

  }
);


/* =====================================
   ERROR AUDIO
===================================== */

audio.addEventListener(
  "error",
  ()=>{

    status.classList.add("error");

    status.textContent =
      "Audio tidak dapat diputar.";

  }
);

</script>

</body>
</html>
