<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluefy Music</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#05070b;
    color:#fff;
    min-height:100vh;
    padding-bottom:125px;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    top:-180px;
    left:-180px;
    background:#087cff;
    opacity:.14;
    filter:blur(110px);
    border-radius:50%;
    z-index:-1;
}

body:after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    right:-190px;
    bottom:50px;
    background:#0048ff;
    opacity:.09;
    filter:blur(110px);
    border-radius:50%;
    z-index:-1;
}

/* HEADER */

header{
    padding:24px 18px 8px;
    max-width:1100px;
    margin:auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:26px;
    font-weight:900;
}

.logo span{
    color:#1683ff;
}

.profile{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg,#1683ff,#06408e);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* SEARCH */

.search{
    height:52px;
    margin-top:20px;
    padding:7px 8px 7px 15px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#11161f;
    border:1px solid #222b38;
    border-radius:15px;
}

.search-icon{
    color:#798493;
    font-size:22px;
}

.search input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:none;
    color:#fff;
    font-size:14px;
}

.search input::placeholder{
    color:#707987;
}

.search button{
    width:38px;
    height:38px;
    border:0;
    border-radius:11px;
    background:#1683ff;
    color:#fff;
    font-size:18px;
}

/* SECTION */

.section{
    max-width:1100px;
    margin:auto;
    padding:20px 18px 0;
}

.title{
    font-size:21px;
    font-weight:800;
    margin-bottom:14px;
}

/* HORIZONTAL */

.horizontal{
    display:flex;
    gap:14px;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
    scroll-snap-type:x mandatory;
    padding:3px 2px 12px;
    -webkit-overflow-scrolling:touch;
}

.horizontal::-webkit-scrollbar{
    display:none;
}

/* LAST */

.last-card{
    min-width:145px;
    max-width:145px;
    scroll-snap-align:start;
    cursor:pointer;
    transition:.2s;
}

.last-card:active{
    transform:scale(.95);
}

.last-cover{
    width:145px;
    height:145px;
    border-radius:14px;
    overflow:hidden;
}

.last-cover img,
.result-cover img,
.mini-cover img,
.player-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.last-title{
    margin-top:9px;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.last-artist{
    color:#778190;
    font-size:12px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* RESULT */

.result-card{
    min-width:172px;
    max-width:172px;
    padding:9px;
    border-radius:16px;
    background:linear-gradient(145deg,#111720,#090c12);
    border:1px solid #202936;
    scroll-snap-align:start;
    cursor:pointer;
    transition:.2s;
}

.result-card:active{
    transform:scale(.95);
}

.result-cover{
    width:100%;
    aspect-ratio:1;
    border-radius:11px;
    overflow:hidden;
}

.result-title{
    margin-top:9px;
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.result-artist{
    margin-top:5px;
    color:#778190;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.play-small{
    width:35px;
    height:35px;
    float:right;
    margin-top:9px;
    border:0;
    border-radius:50%;
    background:#1683ff;
    color:#fff;
}

/* EMPTY COVER */

.empty-cover{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(145deg,#151b24,#080b10);
    color:#2e72bf;
    font-size:38px;
}

/* EMPTY */

.empty{
    min-width:100%;
    padding:35px 10px;
    text-align:center;
    color:#687382;
    font-size:13px;
}

/* LOADING */

.loading{
    display:none;
    padding:30px;
    text-align:center;
    color:#758090;
    font-size:13px;
}

.loading.show{
    display:block;
}

.loader{
    width:28px;
    height:28px;
    margin:0 auto 12px;
    border:3px solid #243041;
    border-top-color:#1683ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* NOTIFICATION */

.notification{
    position:fixed;
    z-index:500;
    top:15px;
    left:50%;
    width:calc(100% - 30px);
    max-width:390px;
    padding:13px;
    border-radius:16px;
    background:#111821;
    border:1px solid #283343;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    transform:translate(-50%,-150%);
    transition:.4s;
}

.notification.show{
    transform:translate(-50%,0);
}

.notif{
    display:flex;
    align-items:center;
    gap:12px;
}

.notif-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#1683ff;
}

.notif-title{
    font-size:14px;
    font-weight:800;
}

.notif-text{
    margin-top:3px;
    color:#788391;
    font-size:12px;
}

/* MINI PLAYER */

.mini{
    position:fixed;
    z-index:300;
    left:10px;
    right:10px;
    bottom:71px;
    height:66px;
    display:none;
    align-items:center;
    padding:7px;
    border-radius:15px;
    background:rgba(14,18,25,.97);
    border:1px solid #252f3d;
    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

.mini.show{
    display:flex;
}

.mini-cover{
    width:51px;
    height:51px;
    border-radius:10px;
    overflow:hidden;
}

.mini-info{
    flex:1;
    min-width:0;
    padding:0 11px;
}

.mini-title{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mini-artist{
    color:#747e8c;
    font-size:11px;
    margin-top:4px;
}

.mini button{
    width:41px;
    height:41px;
    border:0;
    border-radius:50%;
    background:#1683ff;
    color:#fff;
}

/* PLAYER */

.player{
    position:fixed;
    inset:0;
    z-index:400;
    background:#05070b;
    padding:18px;
    overflow-y:auto;
    transform:translateY(100%);
    transition:.4s cubic-bezier(.2,.8,.2,1);
}

.player.open{
    transform:translateY(0);
}

.player-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.player-top button{
    width:42px;
    height:42px;
    border:1px solid #252e3b;
    border-radius:12px;
    background:#10151d;
    color:#fff;
    font-size:19px;
}

.player-cover{
    width:min(82vw,350px);
    aspect-ratio:1;
    margin:45px auto 30px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 25px 80px rgba(0,95,255,.2);
}

.player-title{
    font-size:24px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    color:#7b8594;
    margin-top:7px;
}

.progress{
    margin-top:28px;
}

.progress input,
.volume input{
    width:100%;
    accent-color:#1683ff;
}

.times{
    display:flex;
    justify-content:space-between;
    color:#687281;
    font-size:11px;
    margin-top:5px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:28px;
}

.control{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#121821;
    color:#fff;
    font-size:17px;
}

.main-play{
    width:67px;
    height:67px;
    background:#1683ff;
    font-size:22px;
}

.volume{
    margin-top:25px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* NAV */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:63px;
    z-index:350;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:rgba(5,7,11,.98);
    border-top:1px solid #1b222d;
}

.nav{
    color:#687281;
    text-align:center;
    font-size:10px;
}

.nav.active{
    color:#1683ff;
}

.nav-icon{
    display:block;
    margin-bottom:3px;
    font-size:20px;
}
</style>
</head>

<body>

<!-- NOTIFICATION -->

<div class="notification" id="notification">
    <div class="notif">

        <div class="notif-icon" id="notifIcon">
            ♫
        </div>

        <div>
            <div class="notif-title" id="notifTitle">
                Bluefy Music
            </div>

            <div class="notif-text" id="notifText">
                Siap memutar musik
            </div>
        </div>

    </div>
</div>


<!-- HEADER -->

<header>

    <div class="top">

        <div class="logo">
            blue<span>fy</span>
        </div>

        <div class="profile">
            B
        </div>

    </div>


    <div class="search">

        <div class="search-icon">
            ⌕
        </div>

        <input
            id="searchInput"
            placeholder="Apa yang ingin kamu dengarkan?"
        >

        <button onclick="searchMusic()">
            ⌕
        </button>

    </div>

</header>


<!-- LAST -->

<section class="section">

    <div class="title">
        Putar terakhir
    </div>

    <div
        class="horizontal"
        id="lastPlayed"
    ></div>

</section>


<!-- RESULTS -->

<section class="section">

    <div class="title">

    </div>

    <div
        class="loading"

    >
        <div class="loader"></div>
        Mencari lagu...
    </div>

    <div
        class="horizontal"
        id="results"
    >
        <div class="empty">

        </div>
    </div>

</section>


<!-- MINI PLAYER -->

<div
    class="mini"
    id="mini"
>

    <div
        class="mini-cover"
        id="miniCover"
    ></div>

    <div
        class="mini-info"
        onclick="openPlayer()"
    >

            class="mini-title"

        </div>

        </div>

        id="miniPlay"
        onclick="togglePlay()"

    </button>

</div>


<!-- PLAYER -->

<div
    class="player"
    id="player"
>

    <div class="player-top">

        <button onclick="closePlayer()">
            ↓
        </button>

        <b>Sedang diputar</b>

        <button onclick="closePlayer()">
            ×
        </button>

    </div>


    <div
        class="player-cover"
        id="playerCover"
    ></div>


    <div
        class="player-title"
        id="playerTitle"
    >
        Tidak ada lagu
    </div>

    <div
        class="player-artist"
        id="playerArtist"
    >
        -
    </div>


    <div class="progress">

        <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"

        <div class="times">

                0:00

    <div class="controls">

        <button

            ↶
        </button>

        <input
            id="volume"

</div>


<audio id="audio"></audio>


<!-- BOTTOM -->

<nav class="bottom">

    <div class="nav active">
        <span class="nav-icon">⌂</span>
        Home
    </div>

    <div
        class="nav"
        onclick="focusSearch()"
    >
        <span class="nav-icon">⌕</span>
        Cari
    </div>

    <div
        class="nav"
        onclick="openPlayer()"
    >
        <span class="nav-icon">♫</span>
        Player
    </div>

    <div
        class="nav"
        onclick="showLast()"
    >
        <span class="nav-icon">◷</span>
        Terakhir
    </div>

</nav>


<script>

const API =
"https://api.ikyyxd.my.id/search/ytplay?q=";

const audio =
document.getElementById("audio");

let currentSong = null;
let notificationTimer;


/* =========================
   NOTIFICATION
========================= */

function notify(title,text,icon="♫"){

    clearTimeout(notificationTimer);

    document.getElementById("notifTitle")
        .textContent = title;

    document.getElementById("notifText")
        .textContent = text;

    document.getElementById("notifIcon")
        .textContent = icon;

    const box =
        document.getElementById("notification");

    box.classList.add("show");

    notificationTimer =
        setTimeout(()=>{
            box.classList.remove("show");
        },2800);
}


/* =========================
   GET STRING
========================= */

function text(value){

    if(value === null ||
       value === undefined)
        return "";

    if(typeof value === "string")
        return value.trim();

    if(typeof value === "number")
        return String(value);

    if(typeof value === "object"){

        return (
            value.name ||
            value.title ||
            value.text ||
            value.value ||
            value.label ||
            ""
        );
    }

    return "";
}


/* =========================
   FIND VALUE DEEPLY
========================= */

function deepFind(obj,keys){

    if(!obj ||
       typeof obj !== "object")
        return "";

    for(const key of keys){

        if(
            obj[key] !== undefined &&
            obj[key] !== null
        ){

            const value =
                text(obj[key]);

            if(value)
                return value;
        }
    }


    for(const key in obj){

        if(
            typeof obj[key] === "object"
        ){

            const found =
                deepFind(
                    obj[key],
                    keys
                );

            if(found)
                return found;
        }
    }

    return "";
}


/* =========================
   NORMALIZE SONG
========================= */

function normalizeSong(item){

    if(!item ||
       typeof item !== "object")
        return null;


    let title =
        deepFind(item,[
            "title",
            "name",
            "song",
            "songName",
            "videoTitle",
            "track",
            "trackName"
        ]);


    let artist =
        deepFind(item,[
            "artist",
            "artists",
            "artistName",
            "author",
            "uploader",
            "channel",
            "creator",
            "owner",
            "singer"
        ]);


    let cover =
        deepFind(item,[
            "thumbnail",
            "thumbnailUrl",
            "thumb",
            "image",
            "imageUrl",
            "cover",
            "coverUrl",
            "artwork",
            "poster"
        ]);


    let audioUrl =
        deepFind(item,[
            "audio",
            "audioUrl",
            "audio_url",
            "stream",
            "streamUrl",
            "stream_url",
            "download",
            "downloadUrl",
            "download_url",
            "mp3",
            "mp3Url",
            "mp3_url",
            "playUrl",
            "play_url",
            "mediaUrl",
            "media_url",
            "url"
        ]);


    /*
       Beberapa API memakai
       nested object seperti:
       author: {name:"..."}
       thumbnail: {url:"..."}
    */

    if(!artist &&
       item.author)
        artist =
        deepFind(
            item.author,
            ["name","title","channel"]
        );


    if(!cover &&
       item.thumbnail)
        cover =
        deepFind(
            item.thumbnail,
            ["url","src","link"]
        );


    if(!audioUrl){

        audioUrl =
        deepFind(
            item,
            [
                "src",
                "source",
                "file",
                "fileUrl",
                "directUrl"
            ]
        );

    }


    /*
       Jangan membuang hasil hanya karena
       cover atau artist kosong.
    */

    if(!title && !audioUrl)
        return null;


    return {

        title:
            title ||
            "Musik tanpa judul",

        artist:
            artist ||
            "Artis tidak diketahui",

        cover:
            cover || "",

        audio:
            audioUrl || ""

    };
}


/* =========================
   COLLECT OBJECTS
========================= */

function collectObjects(data){

    const found = [];
    const seen = new Set();


    function walk(value){

        if(!value ||
           typeof value !== "object")
            return;


        if(seen.has(value))
            return;

        seen.add(value);


        if(!Array.isArray(value)){

            const song =
                normalizeSong(value);

            if(song)
                found.push(song);

        }


        if(Array.isArray(value)){

            value.forEach(item=>{
                walk(item);
            });

        }else{

            Object.values(value)
                .forEach(item=>{
                    walk(item);
                });

        }

    }


    walk(data);


    return found;
}


/* =========================
   SEARCH
========================= */

async function searchMusic(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value.trim();


    if(!query){

        notify(
            "Masukkan lagu",
            "Ketik judul lagu terlebih dahulu",
            "!"
        );

        return;
    }


    const loading =
        document.getElementById(
            "loading"
        );

    const results =
        document.getElementById(
            "results"
        );


    results.innerHTML = "";

    loading.classList.add("show");


    notify(
        "Mencari lagu",
        `"${query}" sedang dicari...`,
        "⌕"
    );


    try{

        const response =
            await fetch(
                API +
                encodeURIComponent(query),
                {
                    method:"GET",
                    headers:{
                        "Accept":
                        "application/json"
                    }
                }
            );


        if(!response.ok)
            throw new Error(
                "HTTP " + response.status
            );


        const data =
            await response.json();


        console.log(
            "API RESPONSE:",
            data
        );


        let songs =
            collectObjects(data);


        /*
           Hapus duplikat
        */

        const unique = new Map();


        songs.forEach(song=>{

            const key =
                (
                    song.audio ||
                    song.title
                ).toString();


            if(!unique.has(key))
                unique.set(key,song);

        });


        songs =
            Array.from(
                unique.values()
            );


        loading.classList.remove("show");


        if(!songs.length){

            results.innerHTML = `
                <div class="empty">
                    Tidak ada musik ditemukan
                </div>
            `;

            notify(
                "Musik tidak ditemukan",
                "API tidak mengembalikan data lagu",
                "!"
            );

            return;
        }


        notify(
            "Lagu ditemukan",
            `${songs.length} lagu ditemukan`,
            "✓"
        );


        renderResults(songs);

    }

    catch(error){

        console.error(
            "SEARCH ERROR:",
            error
        );


        loading.classList.remove("show");


        results.innerHTML = `
            <div class="empty">
                Gagal mengambil data musik
            </div>
        `;


        notify(
            "Gagal mencari",
            error.message ||
            "Periksa koneksi atau API",
            "!"
        );

    }

}


/* =========================
   COVER
========================= */

function makeCover(url){

    if(!url){

        return `
            <div class="empty-cover">
                ♫
            </div>
        `;

    }


    return `
        <img
            src="${escapeHTML(url)}"
            onerror="
                this.outerHTML=
                '<div class=&quot;empty-cover&quot;>♫</div>'
            "
        >
    `;

}


/* =========================
   RESULTS
========================= */

function renderResults(songs){

    const results =
        document.getElementById(
            "results"
        );


    results.innerHTML = "";


    songs.forEach(song=>{

        const card =
            document.createElement("div");


        card.className =
            "result-card";


        card.innerHTML = `

            <div class="result-cover">
                ${makeCover(song.cover)}
            </div>

            <div class="result-title">
                ${escapeHTML(song.title)}
            </div>

            <div class="result-artist">
                ${escapeHTML(song.artist)}
            </div>

            <button class="play-small">
                ▶
            </button>

            <div style="clear:both"></div>
        `;


        card.onclick =
            ()=>playSong(song);


        results.appendChild(card);

    });

}


/* =========================
   PLAY SONG
========================= */

function playSong(song){

    if(!song.audio){

        notify(
            "Audio tidak tersedia",
            "API tidak memberikan URL audio",
            "!"
        );

        return;
    }


    currentSong = song;


    audio.src =
        song.audio;


    audio.load();


    audio.play()
        .then(()=>{

            saveLastPlayed(song);

            updateUI();

            notify(
                "Sedang diputar",
                song.title,
                "▶"
            );

        })
        .catch(error=>{

            console.error(
                "PLAY ERROR:",
                error
            );

            updateUI();

            notify(
                "Audio gagal diputar",
                "URL audio tidak dapat dimainkan",
                "!"
            );

        });


    document
        .getElementById("mini")
        .classList.add("show");


    updateUI();

}


/* =========================
   PLAYER UI
========================= */

function updateUI(){

    if(!currentSong)
        return;


    document.getElementById(
        "miniCover"
    ).innerHTML =
        makeCover(
            currentSong.cover
        );


    document.getElementById(
        "miniTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "miniArtist"
    ).textContent =
        currentSong.artist;


    document.getElementById(
        "playerCover"
    ).innerHTML =
        makeCover(
            currentSong.cover
        );


    document.getElementById(
        "playerTitle"
    ).textContent =
        currentSong.title;


    document.getElementById(
        "playerArtist"
    ).textContent =
        currentSong.artist;


    updatePlayButton();

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(!currentSong){

        notify(
            "Belum ada lagu",
            "Pilih lagu terlebih dahulu",
            "♫"
        );

        return;
    }


    if(audio.paused){

        audio.play()
            .catch(()=>{});

    }else{

        audio.pause();

    }

}


function updatePlayButton(){

    const icon =
        audio.paused
        ? "▶"
        : "Ⅱ";


    document.getElementById(
        "miniPlay"
    ).textContent = icon;


    document.getElementById(
        "mainPlay"
    ).textContent = icon;

}


audio.addEventListener(
    "play",
    updatePlayButton
);

audio.addEventListener(
    "pause",
    updatePlayButton
);


/* =========================
   SKIP
========================= */

function skip(seconds){

    if(!audio.src)
        return;


    audio.currentTime +=
        seconds;

}


/* =========================
   PLAYER OPEN
========================= */

function openPlayer(){

    if(!currentSong){

        notify(
            "Belum ada lagu",
            "Pilih lagu terlebih dahulu",
            "♫"
        );

        return;
    }


    document
        .getElementById("player")
        .classList.add("open");

}


function closePlayer(){

    document
        .getElementById("player")
        .classList.remove("open");

}


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "loadedmetadata",
    ()=>{

        document.getElementById(
            "duration"
        ).textContent =
            formatTime(
                audio.duration
            );

    }
);


audio.addEventListener(
    "timeupdate",
    ()=>{

        if(!audio.duration)
            return;


        document.getElementById(
            "progress"
        ).value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        document.getElementById(
            "currentTime"
        ).textContent =
            formatTime(
                audio.currentTime
            );

    }
);


document.getElementById(
    "progress"
).addEventListener(
    "input",
    e=>{

        if(!audio.duration)
            return;


        audio.currentTime =
            (
                e.target.value /
                100
            ) *
            audio.duration;

    }
);


document.getElementById(
    "volume"
).addEventListener(
    "input",
    e=>{

        audio.volume =
            e.target.value;

    }
);


function formatTime(seconds){

    if(!isFinite(seconds))
        return "0:00";


    const min =
        Math.floor(
            seconds / 60
        );


    const sec =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2,"0");


    return `${min}:${sec}`;

}


/* =========================
   LAST PLAYED
========================= */

function saveLastPlayed(song){

    let history =
        JSON.parse(
            localStorage.getItem(
                "bluefy_history"
            ) || "[]"
        );


    history =
        history.filter(
            x =>
            x.audio !== song.audio
        );


    history.unshift(song);


    history =
        history.slice(0,10);


    localStorage.setItem(
        "bluefy_history",
        JSON.stringify(history)
    );


    renderLastPlayed();

}


function renderLastPlayed(){

    const box =
        document.getElementById(
            "lastPlayed"
        );


    let history =
        JSON.parse(
            localStorage.getItem(
                "bluefy_history"
            ) || "[]"
        );


    if(!history.length){

        box.innerHTML = `
            <div class="empty">
                Belum ada lagu yang diputar
            </div>
        `;

        return;
    }


    box.innerHTML = "";


    history.forEach(song=>{

        const card =
            document.createElement("div");


        card.className =
            "last-card";


        card.innerHTML = `

            <div class="last-cover">
                ${makeCover(song.cover)}
            </div>

            <div class="last-title">
                ${escapeHTML(song.title)}
            </div>

            <div class="last-artist">
                ${escapeHTML(song.artist)}
            </div>

        `;


        card.onclick =
            ()=>playSong(song);


        box.appendChild(card);

    });

}


/* =========================
   NAV
========================= */

function focusSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );


    input.focus();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function showLast(){

    document
        .getElementById("lastPlayed")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =========================
   ENTER
========================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "keydown",
        e=>{

            if(e.key === "Enter")
                searchMusic();

        }
    );


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName ===
            "INPUT"
        )
            return;


        if(e.code === "Space"){

            e.preventDefault();

            togglePlay();

        }


        if(e.code === "ArrowRight")
            skip(10);


        if(e.code === "ArrowLeft")
            skip(-10);

    }
);


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   INIT
========================= */

renderLastPlayed();

</script>

</body>
</html>
